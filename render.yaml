services:
  # ── Backend API ───────────────────────────────────────────
  - type: web
    name: vea-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/startup.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://vea-frontend.onrender.com,http://localhost:3000
      - key: DASHBOARD_URL
        sync: false
      # URL de l'API « Ma Bourse d'Études » qui alimente la section Bourses.
      # Laisser vide masque simplement la section — le site reste fonctionnel.
      - key: SCHOLARSHIP_API_URL
        sync: false

  # ── Frontend ──────────────────────────────────────────────
  - type: web
    name: vea-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_URL
        value: https://vea-backend.onrender.com/api

# Neon provides the production PostgreSQL database.
  # ── PostgreSQL ────────────────────────────────────────────
